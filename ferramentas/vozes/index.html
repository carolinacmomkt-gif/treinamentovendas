<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escolha de vozes</title>
<style>
  :root { --fundo: #f6f5f2; --cartao: #fff; --texto: #1d1d1f; --suave: #6b6b70; --borda: #e3e1dc; --destaque: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #141416; --cartao: #1e1e22; --texto: #f2f2f2; --suave: #a0a0a8; --borda: #2e2e34; --destaque: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .fala { color: var(--suave); font-style: italic; margin: 0 0 24px; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .voz { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; }
  .voz.top { border-color: var(--destaque); }
  .nome { font-weight: 600; }
  .info { color: var(--suave); font-size: 14px; margin-bottom: 10px; }
  audio { width: 100%; }
  .estrelas { margin-top: 8px; display: flex; gap: 4px; }
  .estrelas button { background: none; border: 0; font-size: 24px; cursor: pointer; color: var(--borda); padding: 0; }
  .estrelas button.on { color: var(--destaque); }
  .barra { display: flex; gap: 12px; align-items: center; margin-top: 32px; flex-wrap: wrap; }
  .barra button { background: var(--destaque); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
  .vazio { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 20px; }
  code { background: var(--borda); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Qual voz soa mais humana?</h1>
  <p class="fala" id="fala"></p>
  <div id="lista"></div>
  <div class="barra" id="barra" hidden>
    <button id="copiar">Copiar meu resultado</button>
    <span id="aviso" class="info"></span>
  </div>
</main>
<script src="amostras/vozes.js"></script>
<script>
  const vozes = window.VOZES || [];
  const lista = document.getElementById("lista");
  let notas = {};
  try { notas = JSON.parse(localStorage.getItem("notas-vozes") || "{}"); } catch {}
  const salvar = () => { try { localStorage.setItem("notas-vozes", JSON.stringify(notas)); } catch {} };

  if (!vozes.length) {
    lista.innerHTML = '<div class="vazio">Nenhuma amostra ainda. Rode <code>node --env-file=.env ferramentas/vozes/gerar-amostras.mjs</code> na pasta do projeto.</div>';
  } else {
    document.getElementById("fala").textContent = `"${window.FALA}"`;
    document.getElementById("barra").hidden = false;
    for (const [genero, titulo] of [["female", "Vozes femininas"], ["male", "Vozes masculinas"]]) {
      const grupo = vozes.filter((v) => v.genero === genero);
      if (!grupo.length) continue;
      const h = document.createElement("h2"); h.textContent = titulo; lista.append(h);
      const grade = document.createElement("div"); grade.className = "grade"; lista.append(grade);
      for (const v of grupo) {
        const cartao = document.createElement("div");
        cartao.className = "voz";
        cartao.innerHTML = `<div class="nome"></div><div class="info"></div><audio controls preload="none"></audio><div class="estrelas"></div>`;
        cartao.querySelector(".nome").textContent = v.nome;
        cartao.querySelector(".info").textContent = [v.idade, v.descricao].filter(Boolean).join(" · ");
        cartao.querySelector("audio").src = `amostras/${v.arquivo}`;
        const estrelas = cartao.querySelector(".estrelas");
        const pintar = () => {
          [...estrelas.children].forEach((b, i) => b.classList.toggle("on", i < (notas[v.id] || 0)));
          cartao.classList.toggle("top", (notas[v.id] || 0) >= 5);
        };
        for (let i = 1; i <= 5; i++) {
          const b = document.createElement("button");
          b.textContent = "★"; b.title = `${i} de 5`;
          b.onclick = () => { notas[v.id] = i; salvar(); pintar(); };
          estrelas.append(b);
        }
        pintar();
        grade.append(cartao);
      }
    }
  }

  document.getElementById("copiar").onclick = async () => {
    const linhas = vozes
      .filter((v) => notas[v.id])
      .sort((a, b) => notas[b.id] - notas[a.id])
      .map((v) => `${notas[v.id]}★ ${v.genero === "female" ? "F" : "M"} ${v.nome} (${v.id})`);
    const texto = linhas.length ? linhas.join("\n") : "Nenhuma voz avaliada ainda.";
    try { await navigator.clipboard.writeText(texto); document.getElementById("aviso").textContent = "Copiado. Cole na conversa."; }
    catch { document.getElementById("aviso").textContent = texto; }
  };
</script>
</body>
</html>
